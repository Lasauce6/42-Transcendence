<form (submit)="onSubmit($event)">
  <label for="username">{{ 'AUTH.REGISTER.USERNAME_LABEL' | translate }}</label>
  <input
    id="username"
    type="text"
    autocomplete="username"
    [formField]="loginForm.username"
    [placeholder]="'AUTH.LOGIN.USERNAME_PLACEHOLDER' | translate"
  />

  <label for="password">{{ 'AUTH.LOGIN.PASSWORD_LABEL' | translate }}</label>
  <input
    id="password"
    type="password"
    autocomplete="current-password"
    [formField]="loginForm.password"
    [placeholder]="'AUTH.LOGIN.PASSWORD_PLACEHOLDER' | translate"
  />

  <button type="submit">{{ 'AUTH.LOGIN.SUBMIT' | translate }}</button>

  @if (errorMessage()) {
    <p class="error">{{ errorMessage() | translate }}</p>
  }

  <a routerLink="/register">{{ 'AUTH.LOGIN.NO_ACCOUNT' | translate }}</a>

  <button type="button" (click)="onOAuthLogin('google')">
    {{
      'AUTH.OAUTH.CONTINUE_WITH'
        | translate: { provider: ('AUTH.OAUTH.PROVIDERS.GOOGLE' | translate) }
    }}
  </button>
  <button type="button" (click)="onOAuthLogin('github')">
    {{
      'AUTH.OAUTH.CONTINUE_WITH'
        | translate: { provider: ('AUTH.OAUTH.PROVIDERS.GITHUB' | translate) }
    }}
  </button>
  <button type="button" (click)="onOAuthLogin('fortytwo')">
    {{
      'AUTH.OAUTH.CONTINUE_WITH'
        | translate: { provider: ('AUTH.OAUTH.PROVIDERS.FORTYTWO' | translate) }
    }}
  </button>
</form>
