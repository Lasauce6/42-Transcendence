<form (submit)="onSubmit($event)">
  <input type="email" [formField]="loginForm.email" />
  <input type="password" [formField]="loginForm.password" />
  <button type="submit">Se connecter</button>
  @if (errorMessage()) {
    <p class="error">{{ errorMessage() }}</p>
  }
  <a routerLink="/register">Pas de compte ? S'inscrire</a>
  <button type="button" (click)="onOAuthLogin('google')">Continuer avec Google</button>
  <button type="button" (click)="onOAuthLogin('github')">Continuer avec GitHub</button>
  <button type="button" (click)="onOAuthLogin('fortytwo')">Continuer avec 42</button>
</form>
