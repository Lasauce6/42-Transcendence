<section class="mx-auto flex w-full max-w-md flex-col gap-6 py-6">
  <div class="flex flex-col gap-1.5">
    <p class="font-mono text-[13px] uppercase tracking-widest text-accent">&gt; {{ 'NAV.LOGIN' | translate }}</p>
    <h1>{{ 'AUTH.LOGIN.TITLE' | translate }}</h1>
    <p class="text-muted">{{ 'AUTH.LOGIN.SUBTITLE' | translate }}</p>
  </div>

  <div class="flex flex-col gap-5 rounded-card border border-line bg-surface p-6">
    <form class="flex flex-col gap-4" (submit)="onSubmit($event)">
      <ui-field [label]="'AUTH.REGISTER.USERNAME_LABEL' | translate" for="username">
        <input
          id="username"
          type="text"
          autocomplete="username"
          [formField]="loginForm.username"
          [placeholder]="'AUTH.LOGIN.USERNAME_PLACEHOLDER' | translate"
        />
      </ui-field>

      <ui-field [label]="'AUTH.LOGIN.PASSWORD_LABEL' | translate" for="password">
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          [formField]="loginForm.password"
          [placeholder]="'AUTH.LOGIN.PASSWORD_PLACEHOLDER' | translate"
        />
      </ui-field>

      @if (errorMessage()) {
        <ui-alert variant="error">{{ errorMessage() | translate }}</ui-alert>
      }

      <button uiButton type="submit" class="w-full">{{ 'AUTH.LOGIN.SUBMIT' | translate }}</button>
    </form>

    <div class="flex items-center gap-3 font-mono text-xs uppercase text-muted">
      <span class="h-px grow bg-line"></span>{{ 'AUTH.OAUTH.OR' | translate }}<span class="h-px grow bg-line"></span>
    </div>

    <div class="flex flex-col gap-2.5">
      <button uiButton variant="secondary" type="button" class="w-full" (click)="onOAuthLogin('fortytwo')">
        {{ 'AUTH.OAUTH.CONTINUE_WITH' | translate: { provider: ('AUTH.OAUTH.PROVIDERS.FORTYTWO' | translate) } }}
      </button>
      <button uiButton variant="secondary" type="button" class="w-full" (click)="onOAuthLogin('google')">
        {{ 'AUTH.OAUTH.CONTINUE_WITH' | translate: { provider: ('AUTH.OAUTH.PROVIDERS.GOOGLE' | translate) } }}
      </button>
      <button uiButton variant="secondary" type="button" class="w-full" (click)="onOAuthLogin('github')">
        {{ 'AUTH.OAUTH.CONTINUE_WITH' | translate: { provider: ('AUTH.OAUTH.PROVIDERS.GITHUB' | translate) } }}
      </button>
    </div>
  </div>

  <p class="text-center"><a routerLink="/register">{{ 'AUTH.LOGIN.NO_ACCOUNT' | translate }}</a></p>
</section>
