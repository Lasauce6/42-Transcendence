<section class="mx-auto flex w-full max-w-md flex-col gap-6 py-6">
  <div class="flex flex-col gap-1.5">
    <p class="font-mono text-[13px] uppercase tracking-widest text-accent">&gt; {{ 'NAV.REGISTER' | translate }}</p>
    <h1>{{ 'AUTH.REGISTER.TITLE' | translate }}</h1>
    <p class="text-muted">{{ 'AUTH.REGISTER.SUBTITLE' | translate }}</p>
  </div>

  <form class="flex flex-col gap-4 rounded-card border border-line bg-surface p-6" (submit)="onSubmit($event)">
    <ui-field
      [label]="'AUTH.REGISTER.USERNAME_LABEL' | translate"
      for="username"
      [error]="registerForm.username().touched() && registerForm.username().invalid() ? ('ERRORS.USERNAME_REQUIRED' | translate) : null"
    >
      <input id="username" type="text" autocomplete="username" [formField]="registerForm.username" />
    </ui-field>

    <ui-field
      [label]="'AUTH.REGISTER.EMAIL_LABEL' | translate"
      for="email"
      [error]="registerForm.email().touched() && registerForm.email().invalid() ? ('ERRORS.EMAIL_INVALID' | translate) : null"
    >
      <input id="email" type="email" autocomplete="email" [formField]="registerForm.email" />
    </ui-field>

    <ui-field
      [label]="'AUTH.REGISTER.PASSWORD_LABEL' | translate"
      for="password"
      [error]="registerForm.password().touched() && registerForm.password().invalid() ? ('ERRORS.PASSWORD_REQUIRED' | translate) : null"
    >
      <input id="password" type="password" autocomplete="new-password" [formField]="registerForm.password" />
    </ui-field>

    <ui-field
      [label]="'AUTH.REGISTER.CONFIRM_LABEL' | translate"
      for="confirmPassword"
      [error]="registerForm.confirmPassword().touched() && registerForm.confirmPassword().invalid() ? ('ERRORS.PASSWORD_MISMATCH' | translate) : null"
    >
      <input id="confirmPassword" type="password" autocomplete="new-password" [formField]="registerForm.confirmPassword" />
    </ui-field>

    @if (errorMessage()) {
      <ui-alert variant="error">{{ errorMessage() | translate }}</ui-alert>
    }

    <button uiButton type="submit" class="w-full" [disabled]="registerForm().invalid()">
      {{ 'AUTH.REGISTER.SUBMIT' | translate }}
    </button>
  </form>

  <p class="text-center"><a routerLink="/login">{{ 'AUTH.REGISTER.HAVE_ACCOUNT' | translate }}</a></p>
</section>
