<section class="flex flex-col gap-6">
  <ui-page-header [eyebrow]="'NAV.CHAT' | translate" [heading]="'CHAT.TITLE' | translate" />

  <div class="flex flex-wrap items-start gap-6">
    <ui-card class="min-w-0 grow-[999] basis-[560px]" [padded]="false">
      <div class="border-b border-line p-4">
        <label for="chat-search" class="sr-only">{{ 'CHAT.SEARCH' | translate }}</label>
        <div class="relative">
          <ui-icon name="search" [size]="18" class="pointer-events-none absolute top-1/2 left-3 -translate-y-1/2 text-muted" />
          <input
            id="chat-search"
            type="search"
            class="w-full pl-10"
            [placeholder]="'CHAT.SEARCH' | translate"
            [value]="query()"
            (input)="onSearch($event)"
          />
        </div>
      </div>

      @if (loading()) {
        <div class="p-5"><ui-spinner [label]="'CHAT.LOADING' | translate" /></div>
      } @else if (error()) {
        <div class="flex flex-col items-start gap-3 p-5">
          <ui-alert variant="error">{{ 'CHAT.ERROR' | translate }}</ui-alert>
          <button uiButton variant="secondary" size="sm" type="button" (click)="reload()">{{ 'CHAT.RETRY' | translate }}</button>
        </div>
      } @else if (channels().length === 0) {
        <ui-empty-state [heading]="(query() ? 'CHAT.NO_RESULT' : 'CHAT.EMPTY') | translate" icon="message" />
      } @else {
        <ul class="p-1.5">
          @for (c of channels(); track c.id) {
            <li>
              <button
                type="button"
                class="block w-full rounded-control border-0 p-0 text-left font-normal hover:bg-surface-2"
                (click)="open(c)"
              >
                <ui-list-item
                  [heading]="displayName(c) || ('CHAT.UNNAMED' | translate)"
                  [subtitle]="'HOME.CHANNEL_TYPE.' + c.type | translate"
                >
                  <ui-avatar leading [name]="displayName(c) || '#'" [src]="avatarOf(c)" />
                  <time meta class="font-mono text-xs text-muted" [attr.datetime]="c.created_at">{{ c.created_at | date: 'shortDate' }}</time>
                </ui-list-item>
              </button>
            </li>
          }
        </ul>
      }
    </ui-card>

    <ui-card class="min-w-0 grow basis-80" [heading]="'HOME.NEW_CONVERSATION' | translate">
      <form class="flex flex-col gap-3" (submit)="$event.preventDefault(); startConversation()">
        <ui-field [label]="'CHAT.NEW_PLACEHOLDER' | translate" for="new-conversation" [error]="createError() ? ('CHAT.NEW_ERROR' | translate) : null">
          <input
            id="new-conversation"
            type="text"
            [placeholder]="'CHAT.NEW_PLACEHOLDER' | translate"
            [value]="newUsername()"
            (input)="onNewUsernameInput($event)"
          />
        </ui-field>
        <button uiButton type="submit" [disabled]="creating() || !newUsername().trim()">
          <ui-icon name="plus" [size]="18" />{{ 'CHAT.NEW_BUTTON' | translate }}
        </button>
      </form>
    </ui-card>
  </div>
</section>
