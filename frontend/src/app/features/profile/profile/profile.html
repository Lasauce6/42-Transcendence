@if (profile(); as p) {
  <div class="profile">
    <h2>{{ p.username }}</h2>
    <p>{{ p.email }}</p>
    @if (p.avatarUrl) {
      <img [src]="p.avatarUrl" [alt]="'PROFILE.AVATAR_ALT' | translate" />
    }
    <app-profile-edit [profile]="p" (profileUpdated)="profile.set($event)" />
  </div>
} @else if (error()) {
  <p class="error">{{ error()! | translate }}</p>
} @else {
  <p>{{ 'PROFILE.LOADING' | translate }}</p>
}
