@if (profile()) {
  <div class="profile">
    <h2>{{ profile()!.username }}</h2>
    <p>{{ profile()!.email }}</p>
    @if (profile()!.avatarUrl) {
      <img [src]="profile()!.avatarUrl" [alt]="'PROFILE.AVATAR_ALT' | translate" />
    }
  </div>
} @else if (error()) {
  <p class="error">{{ error()! | translate }}</p>
} @else {
  <p>{{ 'PROFILE.LOADING' | translate }}</p>
}
