@if (profile(); as p) {
  <div class="profile">
    <h2>{{ profile()!.username }}</h2>
    <p>{{ profile()!.email }}</p>
    @if (profile()!.avatarUrl) {
      <img [src]="profile()!.avatarUrl" alt="Avatar" />
    }
    <app-profile-edit [profile]="p" />
  </div>
} @else if (error()) {
  <p class="error">{{ error() }}</p>
} @else {
  <p>Chargement du profil...</p>
}
