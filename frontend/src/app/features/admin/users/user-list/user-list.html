<h2>Utilisateurs</h2>

@if (loading()) {
  <p>Chargement…</p>
} @else if (error()) {
  <p class="error">{{ error() }}</p>
} @else {
  <table>
    <thead>
      <tr><th>ID</th><th>Utilisateur</th><th>Email</th><th>Actif</th></tr>
    </thead>
    <tbody>
      @for (user of users(); track user.id) {
        <tr>
          <td>{{ user.id }}</td>
          <td>{{ user.username }}</td>
          <td>{{ user.email }}</td>
          <td>{{ user.is_active ? 'Oui' : 'Non' }}</td>
        </tr>
      } @empty {
        <tr><td colspan="4">Aucun utilisateur</td></tr>
      }
    </tbody>
  </table>
}
