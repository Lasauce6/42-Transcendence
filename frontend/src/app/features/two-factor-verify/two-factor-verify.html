<h2>{{ 'AUTH.TWOFA.VERIFY.TITLE' | translate }}</h2>
<p>{{ 'AUTH.TWOFA.VERIFY.INSTRUCTION' | translate }}</p>

<form (submit)="onSubmit(); $event.preventDefault()">
  <input
    type="text"
    [formField]="verifyForm.code"
    [placeholder]="'AUTH.TWOFA.VERIFY.CODE_PLACEHOLDER' | translate"
  />
  <button type="submit">{{ 'AUTH.TWOFA.VERIFY.SUBMIT' | translate }}</button>
</form>

@if (verifyError()) {
  <p class="error">{{ verifyError()! | translate }}</p>
}
