<section class="mx-auto flex w-full max-w-3xl flex-col gap-6">
  <ui-page-header
    [eyebrow]="'TITLES.NOTIFICATIONS' | translate"
    [heading]="'NOTIFICATIONS.TITLE' | translate"
    [subtitle]="'HOME.UNREAD' | translate: { count: unreadCount() }"
  >
    @if (unreadCount() > 0) {
      <button uiButton variant="secondary" size="sm" type="button" (click)="markAll()">
        <ui-icon name="check" [size]="16" />{{ 'NOTIFICATIONS.MARK_ALL' | translate }}
      </button>
    }
  </ui-page-header>

  <ui-card [padded]="false">
    @if (notifications().length === 0) {
      <ui-empty-state [heading]="'NOTIFICATIONS.EMPTY' | translate" icon="bell" />
    } @else {
      <ul class="flex flex-col gap-0.5">
        @for (n of notifications(); track n.id) {
          <li>
            <button
              type="button"
              class="flex w-full items-center gap-3.5 rounded-control border-0 px-3.5 py-3 text-left font-normal hover:bg-surface-2"
              [class.bg-surface-2]="!n.is_read"
              (click)="open(n)"
            >
              <span
                class="flex size-10 shrink-0 items-center justify-center rounded-control bg-surface-2"
                [class.text-accent]="!n.is_read"
                [class.text-muted]="n.is_read"
              >
                <ui-icon [name]="icon(n)" [size]="20" />
              </span>
              <span class="min-w-0 grow" [class.font-bold]="!n.is_read" [class.text-muted]="n.is_read">
                {{ labelKey(n) | translate: labelParams(n) }}
              </span>
              <time class="shrink-0 font-mono text-xs text-muted" [attr.datetime]="n.created_at">
                {{ n.created_at | date: 'short' }}
              </time>
              @if (!n.is_read) {
                <span class="size-2 shrink-0 rounded-full bg-accent" aria-hidden="true"></span>
              }
            </button>
          </li>
        }
      </ul>
    }
  </ui-card>
</section>
