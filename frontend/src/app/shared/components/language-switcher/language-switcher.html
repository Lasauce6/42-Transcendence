<label for="lang-select" class="sr-only">{{ 'COMMON.LANGUAGE' | translate }}</label>
<select id="lang-select" class="font-mono text-[13px]" (change)="onChange($event)">
  @for (l of lang.langs; track l) {
    <option [value]="l" [selected]="l === lang.current()">{{ names[l] }}</option>
  }
</select>
