# Regles executees APRES le ruleset CRS (phase 5 = fin de transaction).
# Compteur de violations par IP : chaque reponse 403 (blocage WAF) incremente
# ip.repeated_violations, qui expire au bout d'une heure. Le bannissement est
# applique par la regle 900001 dans REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf.
SecRule RESPONSE_STATUS "@streq 403" \
    "id:999000,phase:5,log,msg:'Violation WAF : compteur IP incremente',setvar:ip.repeated_violations=+1,expirevar:ip.repeated_violations=3600"
