# Exclusions projet executees AVANT les regles CRS.
# Les ctl:ruleRemoveByTag/ById agissent sur toute la transaction,
# peu importe l'ordre des phases.

# Collection IP persistante (cle : adresse source)
SecAction "id:900000,phase:1,pass,nolog,initcol:ip=%{remote_addr}"

# Banissement IP temporaire (fail2ban-like, voir RESPONSE-999 qui incremente le compteur)
SecRule IP:REPEATED_VIOLATIONS "@ge 10" \
    "id:900001,phase:1,log,deny,status:403,msg:'IP bannie 1h : violations WAF repetees'"

# Assets Vite du dev-server (/@fs/...) : faux positif LFI 930130
# (/@fs/ figure dans restricted-files.data car il matche l'acces dotfile).
SecRule REQUEST_URI "^/@fs/" \
    "id:900110,phase:1,pass,log,msg:'Vite @fs assets: exclusion regle 930130',ctl:ruleRemoveById=930130"

# WebSocket /ws/ : les frames des parties ne sont pas du trafic HTTP
# inspectable ; on desactive le ruleset pour ces transactions.
SecRule REQUEST_URI "^/ws/" \
    "id:900100,phase:1,pass,log,msg:'WebSocket: ruleset CRS desactive',ctl:ruleRemoveByTag=OWASP_CRS"
